[project]
name = "uas-master-thesis-code"
version = "0.1.0"
description = "Code for my master thesis on water level prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "lightning>=2.5.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "pmdarima>=2.1.1",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "pytorch-forecasting>=1.5.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "tqdm>=4.70.0",
    "torch>=2.7.0",
    "xgboost>=3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["D"]
# Keep reporting unused imports, but do not remove them during auto-fixes.
# unfixable = ["F401"]
ignore = [
    # D203 requires a blank line before class docstrings; Google style uses D211 instead.
    "D203",
    # D213 puts a multi-line summary on the second line; Google style uses D212 instead.
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Tests are executable examples and do not require production-style docstrings.
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
